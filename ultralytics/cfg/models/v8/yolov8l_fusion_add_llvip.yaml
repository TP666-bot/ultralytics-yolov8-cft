# YOLOv8l dual-stream Add fusion for LLVIP (CFT ablation — no Transformer)
# Usage: python tools/train_cft.py model=ultralytics/cfg/models/v8/yolov8l_fusion_add_llvip.yaml data=llvip_dual.yaml

dual: true
nc: 1
depth_multiple: 1.0
width_multiple: 1.0
scales:
  l: [1.0, 1.0, 512]

backbone:
  # RGB stream 0-9
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 6, C2f, [256, True]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 6, C2f, [512, True]] # 6
  - [-1, 1, Conv, [1024, 3, 2]] # 7-P5/32
  - [-1, 3, C2f, [1024, True]] # 8
  - [-1, 1, SPPF, [1024, 5]] # 9
  # IR stream 10-19
  - [-4, 1, Conv, [64, 3, 2]] # 10-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 11
  - [-1, 3, C2f, [128, True]] # 12
  - [-1, 1, Conv, [256, 3, 2]] # 13-P3/8
  - [-1, 6, C2f, [256, True]] # 14
  - [-1, 1, Conv, [512, 3, 2]] # 15-P4/16
  - [-1, 6, C2f, [512, True]] # 16
  - [-1, 1, Conv, [1024, 3, 2]] # 17-P5/32
  - [-1, 3, C2f, [1024, True]] # 18
  - [-1, 1, SPPF, [1024, 5]] # 19
  # Add fusion P3/P4/P5
  - [[4, 14], 1, Add, [1]] # 20
  - [[6, 16], 1, Add, [1]] # 21
  - [[9, 19], 1, Add, [1]] # 22

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 23
  - [[-1, 21], 1, Concat, [1]] # 24
  - [-1, 3, C2f, [512]] # 25
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 26
  - [[-1, 20], 1, Concat, [1]] # 27
  - [-1, 3, C2f, [256]] # 28 P3
  - [-1, 1, Conv, [256, 3, 2]] # 29
  - [[-1, 25], 1, Concat, [1]] # 30
  - [-1, 3, C2f, [512]] # 31 P4
  - [-1, 1, Conv, [512, 3, 2]] # 32
  - [[-1, 22], 1, Concat, [1]] # 33 cat fused P5 backbone
  - [-1, 3, C2f, [1024]] # 34 P5
  - [[28, 31, 34], 1, Detect, [nc]] # 35
