# YOLOv8l + CFT (GPT x3) for LLVIP — mirrors yolov5l_fusion_transformerx3_llvip topology

dual: true
nc: 1
depth_multiple: 1.0
width_multiple: 1.0
scales:
  l: [1.0, 1.0, 512]

backbone:
  # RGB to P3
  - [-1, 1, Conv, [64, 3, 2]] # 0
  - [-1, 1, Conv, [128, 3, 2]] # 1
  - [-1, 3, C2f, [128, True]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3
  - [-1, 6, C2f, [256, True]] # 4 P3 rgb
  # IR to P3
  - [-4, 1, Conv, [64, 3, 2]] # 5
  - [-1, 1, Conv, [128, 3, 2]] # 6
  - [-1, 3, C2f, [128, True]] # 7
  - [-1, 1, Conv, [256, 3, 2]] # 8
  - [-1, 6, C2f, [256, True]] # 9 P3 ir
  # GPT @ P3
  - [[4, 9], 1, GPT, [256]] # 10
  - [[4, 10], 1, Add2, [256, 0]] # 11
  - [[9, 10], 1, Add2, [256, 1]] # 12
  # RGB/IR to P4
  - [11, 1, Conv, [512, 3, 2]] # 13
  - [-1, 6, C2f, [512, True]] # 14 P4 rgb
  - [12, 1, Conv, [512, 3, 2]] # 15
  - [-1, 6, C2f, [512, True]] # 16 P4 ir
  - [[14, 16], 1, GPT, [512]] # 17
  - [[14, 17], 1, Add2, [512, 0]] # 18
  - [[16, 17], 1, Add2, [512, 1]] # 19
  # RGB/IR to P5
  - [18, 1, Conv, [1024, 3, 2]] # 20
  - [-1, 1, SPPF, [1024, 5]] # 21
  - [-1, 3, C2f, [1024, True]] # 22 P5 rgb
  - [19, 1, Conv, [1024, 3, 2]] # 23
  - [-1, 1, SPPF, [1024, 5]] # 24
  - [-1, 3, C2f, [1024, True]] # 25 P5 ir
  - [[22, 25], 1, GPT, [1024]] # 26
  - [[22, 26], 1, Add2, [1024, 0]] # 27
  - [[25, 26], 1, Add2, [1024, 1]] # 28
  # stream fusion
  - [[11, 12], 1, Add, [1]] # 29 P3
  - [[18, 19], 1, Add, [1]] # 30 P4
  - [[27, 28], 1, Add, [1]] # 31 P5

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 32
  - [[-1, 30], 1, Concat, [1]] # 33
  - [-1, 3, C2f, [512]] # 34
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 35
  - [[-1, 29], 1, Concat, [1]] # 36
  - [-1, 3, C2f, [256]] # 37 P3
  - [-1, 1, Conv, [256, 3, 2]] # 38
  - [[-1, 34], 1, Concat, [1]] # 39
  - [-1, 3, C2f, [512]] # 40 P4
  - [-1, 1, Conv, [512, 3, 2]] # 41
  - [[-1, 31], 1, Concat, [1]] # 42 cat fused P5 backbone
  - [-1, 3, C2f, [1024]] # 43 P5
  - [[37, 40, 43], 1, Detect, [nc]] # 44
